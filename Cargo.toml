[package]
name = "argon-control-center"
version = "0.1.0"
edition = "2021"
description = "Gigabyte AORUS-style Desktop Control Center for Argon40 & Raspberry Pi (Fan Curve, Telemetry, Overclocking, Features)"
authors = ["user"]

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
