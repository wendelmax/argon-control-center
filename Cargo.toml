[package]
name = "argon-control-center"
version = "0.4.0"
edition = "2021"
description = "Desktop control center for Raspberry Pi in Argon40 cases: fan curve, telemetry, board-aware overclocking, GPIO lab"
authors = ["wendelmax"]
license = "MIT"
repository = "https://github.com/wendelmax/argon-control-center"
readme = "README.md"

[dependencies]
eframe = { version = "0.31", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
egui = "0.31"
ratatui = "0.29"
resvg = { version = "0.37", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"

[dev-dependencies]
ttf-parser = "0.20"
epaint_default_fonts = "0.31"
