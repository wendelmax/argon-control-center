name: Packages

on:
  push:
    # Semantic version tags only (v1.2.3, v1.2.3-rc.1); old theme snapshot tags are ignored.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    paths:
      - "packaging/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Packages are built only for the Raspberry Pi architecture (64-bit ARM),
  # natively on GitHub's ARM64 runners.
  deb:
    name: .deb (arm64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgl1-mesa-dev libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build package
        run: packaging/debian/build-deb.sh
      - name: Install and smoke test
        run: |
          sudo apt-get install -y ./dist/*.deb
          argon-control-center --status
          test -f /usr/lib/udev/rules.d/60-argon-control-center.rules
          getent group i2c && getent group gpio
          sudo apt-get remove -y argon-control-center
      - uses: actions/upload-artifact@v4
        with:
          name: deb-arm64
          path: dist/*.deb

  rpm:
    name: .rpm Fedora (aarch64)
    runs-on: ubuntu-24.04-arm
    container: fedora:latest
    steps:
      - name: Tooling
        run: dnf install -y rpm-build rpmdevtools git tar systemd-rpm-macros 'dnf-command(builddep)'
      - uses: actions/checkout@v4
      - name: Source tarball
        run: |
          VERSION=$(rpmspec -q --qf '%{version}\n' packaging/rpm/argon-control-center.spec | head -1)
          rpmdev-setuptree
          git config --global --add safe.directory "$PWD"
          git archive --prefix="argon-control-center-$VERSION/" -o ~/rpmbuild/SOURCES/argon-control-center-$VERSION.tar.gz HEAD
          cp packaging/common/argon-control-center.sysusers ~/rpmbuild/SOURCES/
      - name: Build dependencies
        run: dnf builddep -y packaging/rpm/argon-control-center.spec
      - name: Build package
        run: rpmbuild -bb packaging/rpm/argon-control-center.spec
      - name: Install and smoke test
        run: |
          dnf install -y ~/rpmbuild/RPMS/*/argon-control-center-*.rpm
          argon-control-center --status
          getent group i2c && getent group gpio
          mkdir -p dist && cp ~/rpmbuild/RPMS/*/argon-control-center-*.rpm dist/
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-aarch64
          path: dist/*.rpm

  arch:
    name: Arch Linux ARM package (aarch64)
    runs-on: ubuntu-24.04-arm
    # Arch Linux ARM base image (the official archlinux image is x86_64 only).
    container: menci/archlinuxarm:base-devel
    steps:
      - name: Tooling
        run: |
          # pacman's download sandbox (Landlock) is not permitted inside the CI container.
          grep -q '^DisableSandbox' /etc/pacman.conf || sed -i '/^\[options\]/a DisableSandbox' /etc/pacman.conf
          pacman-key --init
          pacman-key --populate archlinuxarm
          pacman -Syu --noconfirm --needed base-devel git cargo libglvnd libxkbcommon wayland libx11
          useradd -m builder
      - uses: actions/checkout@v4
      - name: Build package (local source tarball)
        run: |
          VERSION=$(sed -n 's/^pkgver=//p' packaging/arch/PKGBUILD)
          git config --global --add safe.directory "$PWD"
          WORK=/home/builder/pkg
          mkdir -p $WORK
          cp packaging/arch/PKGBUILD packaging/arch/argon-control-center.install $WORK/
          git archive --prefix="argon-control-center-$VERSION/" -o "$WORK/argon-control-center-$VERSION.tar.gz" HEAD
          chown -R builder $WORK
          # Arch Linux ARM defaults to .pkg.tar.xz; release assets use .pkg.tar.zst.
          cd $WORK && su builder -c "PKGEXT=.pkg.tar.zst makepkg --noconfirm"
          # The AUR metadata must be generated without errors.
          su builder -c "makepkg --printsrcinfo" > /dev/null
      - name: Install and smoke test
        run: |
          pacman -U --noconfirm /home/builder/pkg/argon-control-center-*.pkg.tar.zst
          argon-control-center --status
          getent group i2c && getent group gpio
          mkdir -p dist && cp /home/builder/pkg/argon-control-center-*.pkg.tar.zst dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch-aarch64
          path: dist/*.pkg.tar.zst

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm, arch]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tag matches Cargo.toml version
        run: |
          CARGO_VERSION=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$CARGO_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Release notes
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" dist > release-notes.md && cat release-notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "Argon Control Center $VERSION" --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "Argon Control Center $VERSION" \
              --notes-file release-notes.md \
              --verify-tag $PRERELEASE
          fi

  aur:
    name: AUR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release]
    uses: ./.github/workflows/aur.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
