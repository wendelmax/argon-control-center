<?xml version="1.0" encoding="UTF-8"?>
<!-- Argon Control Center application icon. Original artwork, MIT license (see LICENSE).
     A single-board computer sliding out of an aluminium case. -->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="pcb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3fae6a"/>
      <stop offset="1" stop-color="#1f7a45"/>
    </linearGradient>
    <linearGradient id="caseTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6b727c"/>
      <stop offset="1" stop-color="#3b4048"/>
    </linearGradient>
    <linearGradient id="caseFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f47"/>
      <stop offset="1" stop-color="#1c1f24"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e6ea"/>
      <stop offset="1" stop-color="#9aa1aa"/>
    </linearGradient>
    <radialGradient id="led" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b8f3ff"/>
      <stop offset="1" stop-color="#1fb6e0"/>
    </radialGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="128" cy="234" rx="104" ry="10" fill="#000" opacity="0.25"/>

  <!-- board, partly out of the case -->
  <g transform="rotate(-8 128 96)">
    <rect x="52" y="22" width="152" height="112" rx="10" fill="url(#pcb)" stroke="#155c33" stroke-width="2"/>
    <!-- mounting holes -->
    <circle cx="66" cy="36" r="6" fill="#d9b44a"/><circle cx="66" cy="36" r="3" fill="#155c33"/>
    <circle cx="190" cy="36" r="6" fill="#d9b44a"/><circle cx="190" cy="36" r="3" fill="#155c33"/>
    <!-- 40-pin header -->
    <rect x="80" y="28" width="96" height="16" rx="2" fill="#15171a"/>
    <g fill="#e2c35a">
      <rect x="84" y="31" width="4" height="4"/><rect x="93" y="31" width="4" height="4"/>
      <rect x="102" y="31" width="4" height="4"/><rect x="111" y="31" width="4" height="4"/>
      <rect x="120" y="31" width="4" height="4"/><rect x="129" y="31" width="4" height="4"/>
      <rect x="138" y="31" width="4" height="4"/><rect x="147" y="31" width="4" height="4"/>
      <rect x="156" y="31" width="4" height="4"/><rect x="165" y="31" width="4" height="4"/>
      <rect x="84" y="37" width="4" height="4"/><rect x="93" y="37" width="4" height="4"/>
      <rect x="102" y="37" width="4" height="4"/><rect x="111" y="37" width="4" height="4"/>
      <rect x="120" y="37" width="4" height="4"/><rect x="129" y="37" width="4" height="4"/>
      <rect x="138" y="37" width="4" height="4"/><rect x="147" y="37" width="4" height="4"/>
      <rect x="156" y="37" width="4" height="4"/><rect x="165" y="37" width="4" height="4"/>
    </g>
    <!-- SoC and memory -->
    <rect x="82" y="58" width="40" height="40" rx="4" fill="url(#chip)" stroke="#6f7680" stroke-width="1.5"/>
    <rect x="92" y="68" width="20" height="20" rx="2" fill="#5d646d" opacity="0.35"/>
    <rect x="134" y="62" width="38" height="24" rx="3" fill="#202328"/>
    <!-- traces -->
    <g stroke="#7fd39c" stroke-width="2" fill="none" opacity="0.55" stroke-linecap="round">
      <path d="M122 70 H134"/><path d="M122 80 H134"/>
      <path d="M102 98 V112"/><path d="M112 98 V112 H150"/>
    </g>
  </g>

  <!-- case: lid edge -->
  <path d="M30 118 Q30 106 42 106 H214 Q226 106 226 118 V128 H30 Z" fill="url(#caseTop)"/>
  <rect x="30" y="106" width="196" height="3" rx="1.5" fill="#9aa2ad" opacity="0.8"/>
  <!-- case: body -->
  <path d="M30 126 H226 V206 Q226 222 210 222 H46 Q30 222 30 206 Z" fill="url(#caseFront)"/>
  <rect x="30" y="126" width="196" height="2" fill="#000" opacity="0.35"/>
  <!-- vents -->
  <g fill="#0f1114">
    <rect x="52" y="150" width="96" height="6" rx="3"/>
    <rect x="52" y="166" width="96" height="6" rx="3"/>
    <rect x="52" y="182" width="96" height="6" rx="3"/>
  </g>
  <!-- fan ring and power LED -->
  <circle cx="186" cy="170" r="22" fill="#15181c" stroke="#4b525b" stroke-width="3"/>
  <g fill="#3a4047">
    <path d="M186 170 L186 152 A18 18 0 0 1 200 160 Z"/>
    <path d="M186 170 L204 172 A18 18 0 0 1 194 186 Z"/>
    <path d="M186 170 L178 186 A18 18 0 0 1 168 170 Z"/>
    <path d="M186 170 L170 162 A18 18 0 0 1 180 152 Z"/>
  </g>
  <circle cx="186" cy="170" r="5" fill="#5a616a"/>
  <circle cx="58" cy="206" r="4" fill="url(#led)"/>
</svg>
